version: 0.2

phases:
  install:
    commands:
      - echo "Installing Node 20..."
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
      - node -v

      - chmod +x scripts/start.sh  

  build:
    commands:
      - echo "Building backend..."
      - cd backend
      - mvn clean package -DskipTests
      - cd ..

      - echo "Building frontend..."
      - cd frontend
      - npm install
      - npm run build
      - cd ..

artifacts:
  files:
    - backend/**
    - frontend/build/**/*
    - appspec.yml
    - scripts/**/*