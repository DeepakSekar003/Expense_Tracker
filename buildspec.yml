version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  build:
    commands:
      - echo "Building backend..."
      - cd backend
      - mvn clean package

  post_build:
    commands:
      - echo "Running tests..."
      - mvn test

artifacts:
  files:
    - backend/target/*.jar
    - appspec.yml
    - scripts/**