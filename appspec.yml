version: 0.0
os: linux

files:
  - source: backend/target/expense-tracker-0.0.1-SNAPSHOT.jar
    destination: /home/ec2-user/app
    overwrite: yes

permissions:
  - object: /home/ec2-user/app
    pattern: "*.jar"
    owner: ec2-user
    mode: 755

hooks:
  AfterInstall:
    - location: scripts/start.sh
      timeout: 300
      runas: ec2-user